# picom.conf — Nord rice
# Gestartet von i3: picom --config ~/.config/i3/picom.conf -b

backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# --- Shadows ---
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.55;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'i3bar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Fading ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

# --- Transparency ---
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
# Alacritty & Rofi regeln ihre Transparenz selbst (Text bleibt scharf)

# --- Blur (hinter transparenten Fenstern) ---
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.9; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = false; };
  dropdown_menu = { opacity = 0.95; shadow = false; };
};
